<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectar WhatsApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b141a;
      color: #e9edef;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #111b21;
      border: 1px solid #2a3942;
      border-radius: 12px;
      max-width: 560px;
      width: 100%;
      padding: 28px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .subtitle { color: #8696a0; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .btn-meta { background: #1877f2; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: #3d1f1f; color: #f88; padding: 12px; border-radius: 8px;
      font-size: 0.85rem; margin-bottom: 16px; display: none;
    }
    .info {
      background: #1a2a33; color: #8ecae6; padding: 12px; border-radius: 8px;
      font-size: 0.85rem; margin-bottom: 16px; display: none; line-height: 1.5;
    }
    .hint { font-size: 0.75rem; color: #8696a0; margin-top: 16px; line-height: 1.5; }
    .hint code { background: #2a3942; padding: 2px 5px; border-radius: 4px; }
    ul.setup-list { margin: 8px 0 0 18px; font-size: 0.75rem; color: #8696a0; }
    ul.setup-list li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Conectar WhatsApp Business</h1>
    <p class="subtitle">Conectá tu número para enviar y recibir mensajes desde el panel.</p>

    <div class="error" id="error-box"></div>
    <div class="info" id="info-box"></div>

    <p class="hint" style="margin-top:0" id="connect-intro">Cargando…</p>
    <button class="btn btn-meta" id="btn-oauth" disabled>Conectar WhatsApp con Meta</button>

    <div class="hint" id="setup-hints" style="display:none">
      <strong>Falta activar Embedded Signup:</strong>
      <ul class="setup-list">
        <li>Meta → Administrador de registro insertado → copiá el <strong>Configuration ID</strong></li>
        <li>Variable de entorno: <code>WHATSAPP_CONFIGURATION_ID</code></li>
        <li>Guía: <code>docs/EMBEDDED_SIGNUP.md</code></li>
      </ul>
    </div>
  </div>

  <script>
    const errorBox = document.getElementById('error-box');
    const infoBox = document.getElementById('info-box');
    const btnOauth = document.getElementById('btn-oauth');

    const params = new URLSearchParams(location.search);
    if (params.get('error')) {
      showError(decodeURIComponent(params.get('error')));
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      infoBox.style.display = 'none';
    }

    function showInfo(msg) {
      infoBox.textContent = msg;
      infoBox.style.display = 'block';
    }

    function startMetaConnect() {
      window.location.href = '/auth/whatsapp';
    }

    async function initPage() {
      try {
        const res = await fetch('/api/config/public');
        const appConfig = await res.json();

        if (!appConfig.appId) {
          showError('Falta APP_ID en las variables de entorno');
          return;
        }

        btnOauth.disabled = false;
        btnOauth.textContent = 'Conectar WhatsApp con Meta';

        if (appConfig.hasEmbeddedSignup) {
          document.getElementById('connect-intro').textContent =
            'Embedded Signup activo. Se abrirá el asistente de Meta en esta pestaña para vincular tu número.';
          showInfo('Completá todos los pasos en Meta y volverás al chat automáticamente.');
        } else {
          document.getElementById('connect-intro').textContent =
            'Iniciá sesión con Meta en esta pestaña para vincular WhatsApp.';
          document.getElementById('setup-hints').style.display = 'block';
        }
      } catch (err) {
        showError(err.message);
      }
    }

    btnOauth.addEventListener('click', startMetaConnect);

    fetch('/api/session').then((r) => r.json()).then((data) => {
      if (data.connected) window.location.href = '/chat';
    });

    initPage();
  </script>
</body>
</html>
